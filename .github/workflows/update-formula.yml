name: Update formula
on:
  repository_dispatch:
    types: [unswell-release]
  workflow_dispatch:
    inputs:
      version:
        description: Existing Unswell release tag, such as v0.1.0-alpha.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: formula-updates
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'stokaro/homebrew-unswell' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.event.client_payload.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate the release identifier
        run: python3 scripts/update-formula.py --help >/dev/null && python3 -c 'import os, runpy; runpy.run_path("scripts/update-formula.py")["release_version"](os.environ["RELEASE_VERSION"])'
      - name: Download published assets
        run: |
          gh release download "$RELEASE_VERSION" --repo stokaro/unswell --dir artifacts/release \
            --pattern SHA256SUMS --pattern '*_darwin_*.tar.gz' --pattern '*_linux_*.tar.gz'
      - name: Verify checksums and update the formula
        run: python3 scripts/update-formula.py "$RELEASE_VERSION" --assets artifacts/release
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: publish
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create the verified update PR
        env:
          GH_TOKEN: ${{ steps.publish.outputs.token }}
          PUBLISH_APP_SLUG: ${{ steps.publish.outputs.app-slug }}
        run: python3 scripts/prepare-update.py
